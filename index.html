<body>
<div id="intro" aria-hidden="true">
  <div class="in-stars"></div>
  <div class="in-orb"><div class="in-rays"></div><div class="in-corona"></div><div class="in-moon"></div><div class="in-full"></div><div class="in-spark"></div></div>
  <div class="in-burst"></div>
  <div class="in-skip">TAP TO SKIP</div>
</div>
<div id="splash" class="sp-wait" aria-label="स्वागत">
  <div class="sp-grid"></div>
  <div class="sp-blob b1"></div><div class="sp-blob b2"></div><div class="sp-blob b3"></div>
  <div class="sp-in">
    <img class="sp-logo" src="bihar-shiksha.png" alt="School logo">
    <div class="sp-title">SMART CLASSROOM</div>
    <div class="sp-for">Class 9 to 12 · Free for All</div>

    <div class="sp-bar"><span></span></div>
  </div>
  <div class="sp-foot">© 2026 UHS Dhamuchak · All rights reserved<br>Website managed by: <b>Ankush Sir</b></div>
</div>
<script>
  (function () {
    var s = document.getElementById("splash"), it = document.getElementById("intro"), done = false, started = false;
    function hide() { if (done) return; done = true; s.classList.add("sp-out"); setTimeout(function () { s.remove(); }, 1800); }
    function start() {
      if (started) return; started = true;
      s.classList.remove("sp-wait");
      if (it) { it.classList.add("in-out"); setTimeout(function () { it.remove(); }, 1000); }
      setTimeout(hide, 6000);
    }
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!it || reduce) start(); else { setTimeout(start, 3550); it.addEventListener("click", start); }
    s.addEventListener("click", function () { if (started) hide(); });
  })();
</script>
<div id="printwm" aria-hidden="true"><span>UHS धामुचक</span></div>
<div id="app"><div class="loading">लोड हो रहा है…</div></div>
