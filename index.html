<title>ऑनलाइन फ्री क्लास — उत्क्रमित उच्च माध्यमिक विद्यालय, धामुचक</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-label="स्वागत">
  <div class="sp-grid"></div>
  <div class="sp-blob b1"></div><div class="sp-blob b2"></div><div class="sp-blob b3"></div>
  <div class="sp-in">
    <div class="sp-tag">✦ बिल्कुल मुफ़्त ✦</div>
    <div class="sp-title">ONLINE CLASSES</div>
    <div class="sp-hi">ऑनलाइन क्लासेस</div>
    <div class="sp-by">presented by</div>
    <div class="sp-uhs">UHS</div>
    <div class="sp-school">उत्क्रमित उच्च माध्यमिक विद्यालय, धामुचक</div>
    <div class="sp-bar"><span></span></div>
  </div>
</div>
<script>
  (function () {
    var s = document.getElementById("splash"), done = false;
    function hide() { if (done) return; done = true; s.classList.add("sp-out"); setTimeout(function () { s.remove(); }, 900); }
    setTimeout(hide, 2800);
    s.addEventListener("click", hide);
  })();
</script>
<div id="app"><div class="loading">लोड हो रहा है…</div></div>
<script type="module" src="student.js"></script>
</body>
